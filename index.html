<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauntlet XR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 16px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; }
    #ui { position: fixed; left: 0; right: 0; bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 16px; }
    #enter-ar { padding: 14px 28px; font-size: 18px; border: 0; border-radius: 8px; background: #c8913a; color: #111; cursor: pointer; }
    #enter-ar:disabled { opacity: 0.4; cursor: not-allowed; }
    #status { max-width: 36em; text-align: center; line-height: 1.4; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <button id="enter-ar" disabled>Enter AR</button>
    <div id="status">Loading…</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
